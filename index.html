  /* Interactive game overlays exactly over the game panel in the supplied design */
  .game-wrap{
    position:absolute;
    left:3.7%;
    top:49.7%;
    width:92.6%;
    height:27.2%;
    overflow:hidden;
    border-radius:.8%;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
    touch-action:none;
  }

  .hud{
    position:absolute;
    left:5.1%;
    top:50.6%;
    width:89.5%;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
    font-weight:900;
    text-shadow:2px 2px 0 #3e0d5d;
  }
  .lives{
    display:flex;
    gap:.35em;
    align-items:center;
    font-size:clamp(11px,1.7vw,20px);
  }
  .heart{
    color:var(--pink);
    filter:drop-shadow(1px 1px 0 #fff);
  }
  .score-block{
    display:flex;
    gap:clamp(12px,3vw,42px);
    text-align:center;
    font-size:clamp(10px,1.45vw,18px);
    line-height:1.15;
  }
  .score-block b{
    display:block;
    margin-top:.18em;
    font-size:1.25em;
    color:#fff;
  }

  .play-button{
    position:absolute;
    left:44.5%;
    top:74.3%;
    width:11%;
    height:3.7%;
    opacity:0;
    cursor:pointer;
  }

  .controls-note{
    position:absolute;
    left:6%;
    top:78.2%;
    width:88%;
    text-align:center;
    font-size:clamp(8px,1.15vw,14px);
    color:#fff;
    font-weight:900;
    pointer-events:none;
    text-shadow:1px 1px 0 #2b0d4a;
  }

  .form-overlay{
    position:absolute;
    left:20.3%;
    top:88.45%;
    width:59.4%;
    height:4.6%;
    display:grid;
    grid-template-columns:1fr 31%;
    gap:1.9%;
    align-items:stretch;
  }
  .form-overlay input{
    min-width:0;
    width:100%;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    padding:0 5%;
    color:#5a2c74;
    font:700 clamp(10px,1.65vw,20px) "Courier New",monospace;
  }
  .form-overlay input::placeholder{color:#aa77bc}
  .form-overlay button{
    width:100%;
    height:100%;
    border:0;
    background:transparent;
    color:transparent;
    cursor:pointer;
  }
  .confirm-msg{
    position:absolute;
    left:12%;
    top:93.4%;
    width:76%;
    text-align:center;
    font-size:clamp(8px,1.2vw,15px);
    color:var(--yellow);
    font-weight:900;
    text-shadow:1px 1px 0 #5e1f78;
    min-height:1em;
  }

  .mobile-jump{
    position:fixed;
    right:16px;
    bottom:16px;
    width:68px;
    height:68px;
    border-radius:50%;
    border:4px solid white;
    outline:4px solid var(--pink);
    background:var(--cyan);
    color:#34114d;
    font-weight:1000;
    box-shadow:4px 4px 0 #090215;
    display:none;
    z-index:10;
  }

  @media(max-width:700px){
    .page{padding:0}
    .poster{box-shadow:none}
    .mobile-jump{display:block}
  }
</style>
</head>
<body>
<main class="page">
  <section class="poster" aria-label="Invitación de cumpleaños de Olivia">
    <div class="game-wrap">
      <canvas id="game" width="960" height="430" aria-label="Juego de Olivia estilo runner K-Pop"></canvas>
    </div>

    <div class="hud">
      <div class="lives">
        <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
      </div>
      <div class="score-block">
        <div>PUNTAJE<b id="score">000000</b></div>
        <div>RÉCORD<b id="best">000000</b></div>
      </div>
    </div>

    <button id="startHit" class="play-button" type="button" aria-label="Jugar"></button>
    <div id="controlsNote" class="controls-note">TOCÁ EL JUEGO, ESPACIO O ↑ PARA SALTAR</div>

    <div class="form-overlay">
      <input id="email" type="email" placeholder="tu@mail.com" aria-label="Correo electrónico">
      <button id="confirmBtn" type="button" aria-label="Confirmar asistencia">Confirmar</button>
    </div>
    <div id="confirmMsg" class="confirm-msg" aria-live="polite"></div>
  </section>
</main>

<button id="jumpBtn" class="mobile-jump" type="button">↑</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const startHit=document.getElementById("startHit");
const jumpBtn=document.getElementById("jumpBtn");
const controlsNote=document.getElementById("controlsNote");
const hearts=[...document.querySelectorAll(".heart")];

let state="idle",score=0,best=0,lives=3,speed=6,frame=0,spawn=0;
let shield=0,superJump=0,invincible=0,combo=0,comboTime=0;
let objects=[],particles=[];
const ground=346;
const player={x:105,y:276,w:52,h:70,vy:0,jumps:0};

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function txt(t,x,y,size,c,align="left"){
  ctx.fillStyle=c;
  ctx.font=`bold ${size}px Courier New`;
  ctx.textAlign=align;
  ctx.fillText(t,x,y);
}
function glowRect(x,y,w,h,c,blur=12){
  ctx.save();
  ctx.shadowColor=c;ctx.shadowBlur=blur;
  rect(x,y,w,h,c);
  ctx.restore();
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,ground);
  g.addColorStop(0,"#160448");
  g.addColorStop(.55,"#261060");
  g.addColorStop(1,"#39126f");
  ctx.fillStyle=g;ctx.fillRect(0,0,960,430);

  // stars
  for(let i=0;i<52;i++){
    const x=(i*137+frame*.25)%960;
    const y=(i*53)%190;
    rect(x,y,2+(i%3===0?2:0),2+(i%3===0?2:0),i%4===0?"#ffe66f":"#fff");
  }

  // distant skyline
  for(let x=-(frame*speed*.18)%110;x<960;x+=110){
    rect(x,210,42,136,"#1e1d6f");
    rect(x+8,188,26,22,"#382b9e");
    rect(x+52,235,46,111,"#4d1d82");
    rect(x+64,212,22,23,"#74239f");

    for(let yy=228;yy<330;yy+=22){
      rect(x+9,yy,6,9,(yy/22)%2?"#54e9ff":"#ff4ab7");
      rect(x+25,yy+8,6,9,"#ffe66f");
      rect(x+62,yy,6,9,"#ff4ab7");
      rect(x+78,yy+7,6,9,"#54e9ff");
    }
  }

  // neon signs
  glowRect(18,210,118,54,"#ff4ab7",16);
  rect(23,215,108,44,"#2b0c69");
  txt("K-POP",77,245,23,"#ffb0e3","center");

  glowRect(744,210,126,58,"#54e9ff",14);
  rect(749,215,116,48,"#2b0c69");
  txt("FIGHT!",807,246,21,"#ffe66f","center");

  // neon heart
  ctx.save();
  ctx.shadowColor="#ff4ab7";ctx.shadowBlur=16;
  txt("♥",500,210,58,"#ff4ab7","center");
  ctx.restore();

  // cherry blossom tree
  rect(875,155,12,191,"#5d2857");
  for(let i=0;i<28;i++){
    const bx=845+(i*31)%90;
    const by=130+(i*47)%115;
    glowRect(bx,by,10,10,"#ff7fc9",8);
  }

  // ground
  rect(0,ground,960,84,"#2b0d46");
  rect(0,ground,960,8,"#ff4ab7");
  for(let x=-(frame*speed)%42;x<960;x+=42){
    rect(x,ground+20,32,15,"#6d2c72");
    rect(x+5,ground+39,32,15,"#4b1e59");
    rect(x,ground+58,32,15,"#6d2c72");
  }
}

function drawOlivia(){
  const x=Math.round(player.x),y=Math.round(player.y);
  const bob=state==="running"&&player.y>=ground-player.h?(Math.floor(frame/6)%2)*2:0;

  // ponytail
  rect(x+37,y+1+bob,20,15,"#6a4938");
  rect(x+47,y+10+bob,13,19,"#6a4938");
  rect(x+38,y+8+bob,7,7,"#4dd86d");

  // hair and face
  rect(x+7,y+bob,34,11,"#6a4938");
  rect(x+4,y+7+bob,40,19,"#6a4938");
  rect(x+11,y+16+bob,29,25,"#f0bd9e");
  rect(x+16,y+23+bob,4,4,"#2c1837");
  rect(x+31,y+23+bob,4,4,"#2c1837");
  rect(x+21,y+34+bob,10,3,"#d76583");

  // flower-blue K-pop outfit
  rect(x+8,y+41+bob,35,19,"#62a9e8");
  rect(x+3,y+44+bob,8,16,"#7fc8ff");
  rect(x+43,y+44+bob,8,16,"#7fc8ff");
  rect(x+12,y+47+bob,7,7,"#fff");
  rect(x+30,y+49+bob,7,7,"#fff");
  rect(x+10,y+60+bob,33,8,"#355fb3");

  // legs
  rect(x+13,y+68+bob,8,7,"#f0bd9e");
  rect(x+31,y+68+bob,8,7,"#f0bd9e");
  rect(x+8,y+73+bob,16,6,"#fff");
  rect(x+28,y+73+bob,16,6,"#fff");

  if(shield>0){
    ctx.save();
    ctx.strokeStyle="#ff4ab7";ctx.lineWidth=5;ctx.shadowColor="#ff4ab7";ctx.shadowBlur=16;
    ctx.strokeRect(x-8,y-8,player.w+16,player.h+16);
    ctx.restore();
  }
  if(invincible>0&&Math.floor(frame/5)%2===0){
    ctx.strokeStyle="#ffe66f";ctx.lineWidth=3;
    ctx.strokeRect(x-12,y-12,player.w+24,player.h+24);
  }
}

function drawObject(o){
  if(o.type==="speaker"){
    rect(o.x,o.y,o.w,o.h,"#090611");
    rect(o.x+4,o.y+4,o.w-8,o.h-8,"#56306f");
    rect(o.x+12,o.y+9,18,18,"#111");
    glowRect(o.x+16,o.y+13,10,10,"#54e9ff",8);
    rect(o.x+9,o.y+33,24,24,"#111");
    glowRect(o.x+15,o.y+39,12,12,"#ff4ab7",8);
  }else if(o.type==="enemy"){
    rect(o.x+4,o.y+7,36,37,"#6f207c");
    rect(o.x+12,o.y,21,12,"#9d64ff");
    rect(o.x+12,o.y+18,6,6,"#fff");
    rect(o.x+27,o.y+18,6,6,"#fff");
    rect(o.x+18,o.y+33,12,5,"#ff4ab7");
  }else if(o.type==="heart"){
    glowRect(o.x+3,o.y+6,10,9,"#ff4ab7",10);
    glowRect(o.x+17,o.y+6,10,9,"#ff4ab7",10);
    glowRect(o.x+7,o.y+14,16,10,"#ff4ab7",10);
    glowRect(o.x+11,o.y+24,8,7,"#ff4ab7",10);
  }else if(o.type==="note"){
    glowRect(o.x+8,o.y,7,23,"#54e9ff",10);
    glowRect(o.x+15,o.y+4,14,5,"#54e9ff",10);
    glowRect(o.x+3,o.y+21,12,10,"#54e9ff",10);
  }else{
    glowRect(o.x+10,o.y,10,8,"#ffe66f",10);
    glowRect(o.x+3,o.y+8,24,10,"#ffe66f",10);
    glowRect(o.x+8,o.y+18,14,12,"#ffe66f",10);
  }
}

function spawnObject(){
  const r=Math.random();
  if(r<.58){
    const types=["star","heart","note"];
    const type=types[Math.floor(Math.random()*types.length)];
    objects.push({type,x:980,y:112+Math.random()*125,w:30,h:32,collected:false});
  }else{
    const type=Math.random()<.76?"speaker":"enemy";
    objects.push({
      type,
      x:980,
      y:type==="speaker"?ground-62:ground-50,
      w:type==="speaker"?42:44,
      h:type==="speaker"?62:50,
      hit:false
    });
  }
}

function collide(a,b){
  const pad=6;
  return a.x+pad<b.x+b.w&&a.x+a.w-pad>b.x&&a.y+pad<b.y+b.h&&a.y+a.h-pad>b.y;
}
function burst(x,y,c){
  for(let i=0;i<14;i++){
    particles.push({x,y,vx:Math.random()*7-3.5,vy:Math.random()*-6,life:28,c});
  }
}
function jump(){
  if(state==="idle"||state==="over"){startGame();return}
  if(state==="running"&&player.jumps<2){
    player.vy=superJump>0?-16:-13.1;
    player.jumps++;
    burst(player.x+24,ground-4,"#fff");
  }
}
function collect(o){
  o.collected=true;
  combo++;
  comboTime=150;
  const comboBonus=Math.min(12,combo*2);

  if(o.type==="star"){
    score+=10+comboBonus;
    burst(o.x+15,o.y+15,"#ffe66f");
  }
  if(o.type==="heart"){
    shield=420;
    score+=8;
    burst(o.x+15,o.y+15,"#ff4ab7");
  }
  if(o.type==="note"){
    superJump=420;
    score+=8;
    burst(o.x+15,o.y+15,"#54e9ff");
  }
}
function hit(o){
  if(o.hit||invincible>0)return;
  o.hit=true;
  combo=0;

  if(shield>0){
    shield=0;
    invincible=95;
    burst(player.x+25,player.y+30,"#ff4ab7");
    return;
  }

  lives--;
  hearts.forEach((h,i)=>h.style.opacity=i<lives?"1":".18");
  invincible=125;
  burst(player.x+25,player.y+30,"#9d64ff");

  if(lives<=0)endGame();
}
function update(){
  if(state!=="running")return;

  frame++;
  score+=.11;
  speed=Math.min(13,6+score/105);

  player.vy+=.74;
  player.y+=player.vy;
  if(player.y>=ground-player.h){
    player.y=ground-player.h;
    player.vy=0;
    player.jumps=0;
  }

  shield=Math.max(0,shield-1);
  superJump=Math.max(0,superJump-1);
  invincible=Math.max(0,invincible-1);
  if(comboTime>0)comboTime--;else combo=0;

  spawn--;
  if(spawn<=0){
    spawnObject();
    spawn=50+Math.random()*55;
  }

  objects.forEach(o=>o.x-=speed);

  for(const o of objects){
    if((o.type==="speaker"||o.type==="enemy")&&collide(player,o))hit(o);
    if(!["speaker","enemy"].includes(o.type)&&!o.collected&&collide(player,o))collect(o);
  }

  objects=objects.filter(o=>o.x>-80&&!o.collected);

  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.23;p.life--;
  });
  particles=particles.filter(p=>p.life>0);

  scoreEl.textContent=String(Math.floor(score)).padStart(6,"0");
}
function draw(){
  drawSky();
  objects.forEach(drawObject);
  particles.forEach(p=>glowRect(p.x,p.y,4,4,p.c,6));
  drawOlivia();

  if(combo>1)txt(`COMBO x${combo}`,20,30,16,"#ffe66f");
  if(shield>0)txt("ESCUDO",20,52,15,"#ff8bd8");
  if(superJump>0)txt("SÚPER SALTO",20,73,15,"#54e9ff");

  if(state==="idle"){
    ctx.fillStyle="rgba(11,4,44,.82)";
    ctx.fillRect(280,118,400,110);
    txt("¡JUGÁ CON OLIVIA!",480,160,28,"#ff8bd8","center");
    txt("TOCÁ PARA EMPEZAR",480,196,17,"#ffe66f","center");
  }
  if(state==="over"){
    ctx.fillStyle="rgba(11,4,44,.86)";
    ctx.fillRect(300,120,360,105);
    txt("FIN DE LA MISIÓN",480,160,26,"#ff8bd8","center");
    txt("PUNTAJE: "+Math.floor(score),480,196,18,"#ffe66f","center");
  }
}
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
function startGame(){
  state="running";
  score=0;speed=6;frame=0;spawn=38;lives=3;
  shield=0;superJump=0;invincible=0;combo=0;comboTime=0;
  objects=[];particles=[];
  player.y=ground-player.h;player.vy=0;player.jumps=0;
  hearts.forEach(h=>h.style.opacity="1");
  controlsNote.textContent="SALTÁ · ESQUIVÁ · JUNTÁ PODERES";
}
function endGame(){
  state="over";
  best=Math.max(best,Math.floor(score));
  bestEl.textContent=String(best).padStart(6,"0");
  controlsNote.textContent="TOCÁ EL JUEGO PARA VOLVER A INTENTAR";
}
function resetGame(){
  state="idle";
  score=0;speed=6;lives=3;
  shield=0;superJump=0;invincible=0;combo=0;
  objects=[];particles=[];
  player.y=ground-player.h;player.vy=0;
  hearts.forEach(h=>h.style.opacity="1");
  scoreEl.textContent="000000";
  controlsNote.textContent="TOCÁ EL JUEGO, ESPACIO O ↑ PARA SALTAR";
}

canvas.addEventListener("pointerdown",jump);
startHit.addEventListener("click",startGame);
jumpBtn.addEventListener("click",jump);
window.addEventListener("keydown",e=>{
  if(["Space","ArrowUp","KeyW"].includes(e.code)){
    e.preventDefault();
    jump();
  }
});

const email=document.getElementById("email");
const confirmBtn=document.getElementById("confirmBtn");
const confirmMsg=document.getElementById("confirmMsg");

confirmBtn.addEventListener("click",()=>{
  const valid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
  confirmMsg.textContent=valid
    ?"💖 ¡CONFIRMADO! OLIVIA TE ESPERA PARA LA MISIÓN K‑POP 💖"
    :"Ingresá un mail válido para confirmar.";
});

requestAnimationFrame(loop);
</script>
</body>
</html>
